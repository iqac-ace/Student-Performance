<!doctype html>

<html>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        ACE Student Performance Login
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">

<div class="container">

    <div
        class="row justify-content-center align-items-center min-vh-100"
    >

        <div class="col-lg-5 col-md-7">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h3 class="fw-bold">
                            ACE Student Performance
                        </h3>

                        <p class="text-muted">
                            Adhiyamaan College of Engineering
                            <br>
                            Hosur
                        </p>

                    </div>


                    <div class="alert alert-light border">

                        Secure access for:

                        <strong>
                            IQAC • HOD • Faculty • Students
                        </strong>

                    </div>


                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Sign In
                        </button>

                    </form>


                    <div
                        class="text-center text-muted small mt-4"
                    >

                        Use the username and password
                        provided by the IQAC Coordinator.

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
